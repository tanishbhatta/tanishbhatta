name: metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch: {}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanishbhatta
          filename: github-metrics.svg
          config_timezone: Asia/Kathmandu
          plugin_languages: no
          plugin_isocalendar: yes
